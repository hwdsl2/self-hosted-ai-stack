# Merge only into a stack that already contains this service.
# Requires an explicitly selected compatible image; never active by default.
services:
  kokoro:
    image: ${KOKORO_SECRET_IMAGE:?Select a compatible image for this CPU or CUDA service}
    environment:
      KOKORO_API_KEY_FILE: /run/secrets/kokoro_api_key
    secrets:
      - kokoro_api_key

secrets:
  kokoro_api_key:
    file: ${KOKORO_SECRET_PATH:?Set an absolute host secret-file path}
