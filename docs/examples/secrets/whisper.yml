# Merge only into a stack that already contains this service.
# Requires an explicitly selected compatible image; never active by default.
services:
  whisper:
    image: ${WHISPER_SECRET_IMAGE:?Select a compatible image for this CPU or CUDA service}
    environment:
      WHISPER_API_KEY_FILE: /run/secrets/whisper_api_key
    secrets:
      - whisper_api_key

secrets:
  whisper_api_key:
    file: ${WHISPER_SECRET_PATH:?Set an absolute host secret-file path}
