# Merge only into a stack that already contains this service.
# Requires an explicitly selected compatible image; never active by default.
services:
  ollama:
    image: ${OLLAMA_SECRET_IMAGE:?Select a compatible image for this CPU or CUDA service}
    environment:
      OLLAMA_API_KEY_FILE: /run/secrets/ollama_api_key
    secrets:
      - ollama_api_key

secrets:
  ollama_api_key:
    file: ${OLLAMA_SECRET_PATH:?Set an absolute host secret-file path}
