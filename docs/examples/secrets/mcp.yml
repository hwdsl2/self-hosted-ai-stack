# Merge only into a stack that already contains this service.
# Requires an explicitly selected compatible image; never active by default.
services:
  mcp:
    image: ${MCP_SECRET_IMAGE:?Select a compatible image for this CPU or CUDA service}
    environment:
      MCP_API_KEY_FILE: /run/secrets/mcp_api_key
    secrets:
      - mcp_api_key

secrets:
  mcp_api_key:
    file: ${MCP_SECRET_PATH:?Set an absolute host secret-file path}
