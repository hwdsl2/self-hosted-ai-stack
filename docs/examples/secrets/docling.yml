# Merge only into a stack that already contains this service.
# Requires an explicitly selected compatible image; never active by default.
services:
  docling:
    image: ${DOCLING_SECRET_IMAGE:?Select a compatible image for this CPU or CUDA service}
    environment:
      DOCLING_API_KEY_FILE: /run/secrets/docling_api_key
    secrets:
      - docling_api_key

secrets:
  docling_api_key:
    file: ${DOCLING_SECRET_PATH:?Set an absolute host secret-file path}
