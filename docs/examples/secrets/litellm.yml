# Merge only into a stack that already contains this service.
# Requires an explicitly selected compatible image; never active by default.
services:
  litellm:
    image: ${LITELLM_SECRET_IMAGE:?Select a compatible image for this CPU or CUDA service}
    environment:
      LITELLM_MASTER_KEY_FILE: /run/secrets/litellm_api_key
    secrets:
      - litellm_api_key

secrets:
  litellm_api_key:
    file: ${LITELLM_SECRET_PATH:?Set an absolute host secret-file path}
