# Merge only into a stack that already contains this service.
# Requires an explicitly selected compatible image; never active by default.
services:
  embeddings:
    image: ${EMBEDDINGS_SECRET_IMAGE:?Select a compatible image for this CPU or CUDA service}
    environment:
      EMBED_API_KEY_FILE: /run/secrets/embeddings_api_key
    secrets:
      - embeddings_api_key

secrets:
  embeddings_api_key:
    file: ${EMBEDDINGS_SECRET_PATH:?Set an absolute host secret-file path}
